name: example
on: push

jobs:
  #greeting:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - run: echo hello world

  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cms-analysis:latest
            ghcr.io/${{ github.repository }}/cms-analysis:${{ github.sha }}


  # build_skim_latest:
  #   runs-on: ubuntu-latest
  #   container: rootproject/root:${{ matrix.version }}
  #   continue-on-error: ${{ matrix.allow_failure }}
  #   strategy:
  #     matrix:
  #       version: [6.26.10-conda]
  #       allow_failure: [false]
  #       include:
  #         - version: latest
  #           allow_failure: true
  #  steps:
  #    - name: checkout repository
  #      uses: actions/checkout@v4
  #    - name: latest
  #      run: |
  #        COMPILER=$(root-config --cxx)
  #        FLAGS=$(root-config --cflags --libs)
  #        $COMPILER -g -O3 -Wall -Wextra -Wpedantic -o skim skim.cxx $FLAGS
  skim:
    needs: build-docker-image
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/${{ github.repository }}/cms-analysis:latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: access control
        run: echo ${{ secrets.USER_PASS }} | kinit ${{ secrets.USER_NAME }}@CERN.CH

      - name: skim
        run: |
          chmod +x ./skim
          ./skim root://eosuser.cern.ch//eos/user/g/gstark/AwesomeWorkshopFeb2020/GluGluToHToTauTau.root skim_ggH.root 19.6 11467.0 0.1 > skim_ggH.log
      - uses: actions/upload-artifact@v4
        with:
          name: skim_ggH
          path: |
            skim_ggH.root
            skim_ggH.log
   
  plot:
    needs: skim
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cms-analysis:latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: skim_ggH
      
      - name: plot
        run: |
          python histograms.py skim_ggH.root ggH hist_ggH.root
      - uses: actions/upload-artifact@v4
        with:
          name: histograms
          path: hist_ggH.root

  test:
    needs: plot
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cms-analysis:latest
    steps: 
      - name: checkout repository
        uses: actions/checkout@v4
        
      - name: Download from skim
        uses: actions/download-artifact@v4
        with: 
          name: skim_ggH
      
      - name: Download from plot
        uses: actions/download-artifact@v4
        with: 
          name: histograms 
      
      - name: cutflow test
        run: python tests/test_cutflow_ggH.py
        
      - name: plot test
        run: python tests/test_plot_ggH.py        
      
      - name: mean test
        run: python tests/test_mean_ggH.py   
